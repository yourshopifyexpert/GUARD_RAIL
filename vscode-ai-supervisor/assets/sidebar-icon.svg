<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- AI Supervisor Icon: Eye with circuit pattern -->
  <g>
    <!-- Outer eye shape -->
    <path d="M12 5C7 5 2.73 8.11 1 12.5C2.73 16.89 7 20 12 20C17 20 21.27 16.89 23 12.5C21.27 8.11 17 5 12 5Z"
          stroke="currentColor" stroke-width="1.5" fill="none"/>

    <!-- Inner circle (pupil) -->
    <circle cx="12" cy="12.5" r="3.5"
            stroke="currentColor" stroke-width="1.5" fill="none"/>

    <!-- Circuit pattern inside pupil -->
    <line x1="12" y1="9" x2="12" y2="10.5"
          stroke="currentColor" stroke-width="1"/>
    <line x1="12" y1="14.5" x2="12" y2="16"
          stroke="currentColor" stroke-width="1"/>
    <line x1="9" y1="12.5" x2="10.5" y2="12.5"
          stroke="currentColor" stroke-width="1"/>
    <line x1="13.5" y1="12.5" x2="15" y2="12.5"
          stroke="currentColor" stroke-width="1"/>

    <!-- Small dots for circuit nodes -->
    <circle cx="12" cy="12.5" r="1" fill="currentColor"/>
    <circle cx="12" cy="9" r="0.8" fill="currentColor"/>
    <circle cx="12" cy="16" r="0.8" fill="currentColor"/>
    <circle cx="9" cy="12.5" r="0.8" fill="currentColor"/>
    <circle cx="15" cy="12.5" r="0.8" fill="currentColor"/>
  </g>
</svg>
