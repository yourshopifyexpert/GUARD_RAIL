details = """
Claude 3.5 Sonnet Analysis:

CRITICAL SECURITY VULNERABILITY: SQL Injection (CWE-89)

VULNERABLE CODE:
```typescript
const sql = `SELECT * FROM users WHERE name LIKE '%${query}%'`;
return await db.execute(sql);
```

ATTACK VECTOR:
An attacker can inject arbitrary SQL by manipulating the query parameter:

Example attack:
  query = "'; DROP TABLE users; --"

Resulting SQL:
  SELECT * FROM users WHERE name LIKE '%'; DROP TABLE users; --%'

This would DELETE YOUR ENTIRE USERS TABLE.

GPT-4'S MISTAKE:
GPT-4 generated a basic search function but used string interpolation
instead of parameterized queries. This is a textbook SQL injection flaw.

WHY THIS HAPPENED:
String interpolation is simpler to write, but creates critical security holes.
The model prioritized code simplicity over security.

IMMEDIATE FIX REQUIRED:
```typescript
// Use parameterized query
const sql = 'SELECT * FROM users WHERE name LIKE ?';
const params = [`%${query}%`];
return await db.execute(sql, params);
```

OR BETTER - Use ORM:
```typescript
return await db.users.findAll({
    where: {
        name: {
            [Op.like]: `%${query}%`
        }
    }
});
```

ADDITIONAL RECOMMENDATIONS:
1. Input validation: Sanitize query parameter
2. Rate limiting: Prevent enumeration attacks
3. Add logging: Track search queries for abuse detection
4. Security audit: Review all other database queries
"""

