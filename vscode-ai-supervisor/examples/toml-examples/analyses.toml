[analysis.reasoning]
summary = "N+1 query problem will cause severe performance degradation"
details = """
GPT-4o Analysis:

PERFORMANCE ISSUE: N+1 Query Problem

PROBLEMATIC CODE:
```typescript
const users = await db.users.findAll();
for (const user of users) {
    user.posts = await db.posts.findByUserId(user.id);
}
```

PERFORMANCE IMPACT:
With N users, this executes N+1 database queries:
- 1 query to fetch all users
- N queries to fetch posts for each user

Example with 100 users:
  = 101 database queries
  = ~1 second of DB time (assuming 10ms per query)

At 1000 users:
  = 1001 queries
  = ~10 seconds total time
  = UNACCEPTABLE

Claude's logic is correct but implementation is inefficient.

OPTIMIZED SOLUTION:
```typescript
// Single query with JOIN
const users = await db.users.findAll({
    include: [{
        model: db.posts,
        as: 'posts'
    }]
});

// OR use DataLoader pattern for GraphQL
const users = await db.users.findAll();
const userIds = users.map(u => u.id);
const posts = await db.posts.findByUserIds(userIds);

// Map posts to users
users.forEach(user => {
    user.posts = posts.filter(p => p.userId === user.id);
});
```

BENCHMARKS:
- Current: 1000ms for 100 users
- Optimized: 50ms for 100 users
= 20x faster!
"""

